# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng và chờ lượt trả lời tiếp theo. Dùng khi thiếu thông tin bắt buộc (ví dụ thiếu tên tài khoản, thiếu URL) hoặc cần người dùng xác nhận trước một hành động. Mỗi lần gọi PHẢI truyền tường minh cả `question` và `response_type`, không bao giờ bỏ trống `response_type`. Ví dụ: clarify(question=\"Bạn muốn xem tweet của tài khoản nào?\", response_type=\"text\")."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi gửi cho người dùng"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "BẮT BUỘC truyền. 'text' = hỏi thông tin còn thiếu mà người dùng phải tự gõ (tên tài khoản, URL, từ khóa...); 'yes_no' = xin xác nhận đồng ý/không trước một hành động; 'choice' = chọn một trong `options`."}
        options: {type: array, default: [], items: {type: string}, description: "Danh sách lựa chọn, chỉ dùng khi response_type='choice'"}
      required: [question, response_type]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  # ---------------- Team tools ----------------
  - name: hn_search
    description: "Tìm bài (story) trên Hacker News, nơi cộng đồng dev/tech thảo luận. Dùng khi người dùng nhắc tới Hacker News/HN hoặc muốn biết cộng đồng dev đang bàn gì về một chủ đề. KHÔNG dùng cho tin tức web chung (dùng lookup), tweet (dùng social_search/timeline), paper khoa học (dùng papers), hay đọc một URL cụ thể (dùng fetch)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chủ đề cần tìm, chỉ chứa từ khóa chính (ví dụ 'LLM agents', 'Rust'), không ghép mốc thời gian vào query"}
        sort_by: {type: string, enum: [relevance, date], default: "relevance", description: "'relevance' khi muốn bài nổi bật/liên quan nhất; 'date' khi muốn bài mới nhất"}
        timeframe: {type: string, enum: [any, day, week, month, year], default: "any", description: "'day' = hôm nay, 'week' = tuần này, 'month' = tháng này, 'year' = năm nay, 'any' = không giới hạn thời gian"}
        limit: {type: integer, default: 5, description: "Số bài cần lấy, từ 1 đến 20"}
      required: [query]

  - name: summarize
    description: >
      Lọc và xếp hạng danh sách items đã có từ tool khác (lookup, papers, hn_search...)
      trước khi trình bày bằng format. Dùng khi agent có nhiều kết quả và cần:
      giữ top bài theo điểm (highlights), sắp theo ngày mới nhất (by_date),
      loại trùng lặp theo domain nguồn (dedupe), hoặc xếp hạng theo từ khóa (score).
      KHÔNG dùng để lấy dữ liệu mới (dùng lookup/papers/hn_search);
      KHÔNG dùng để trình bày trực tiếp mà không cần lọc (dùng format).
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách items từ tool khác. Mỗi item là object có thể có: title, url, source, summary, score, date/published."
          items: {type: object}
        mode:
          type: string
          enum: [highlights, by_date, dedupe, score]
          default: "highlights"
          description: "'highlights' = top N theo field score; 'by_date' = mới nhất trước theo date/published; 'dedupe' = bỏ trùng lặp theo source domain; 'score' = xếp hạng theo số từ khóa của query xuất hiện trong title+summary"
        query:
          type: string
          default: ""
          description: "Từ khóa để xếp hạng, chỉ truyền khi mode='score'"
        limit:
          type: integer
          default: 5
          description: "Số item đầu ra, từ 1 đến 20"
      required: [items]
